# DEV stage — runs on every pull request and every push to main. Must stay fast (< 5 min):
# it is the feedback loop researchers wait on. Branch protection requires all jobs green.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {enable-cache: true}
      - run: uv sync --frozen --extra dev --no-install-project   # no torch: lint stays fast
      - run: uv run --no-sync ruff check . --output-format=github
      - run: uv run --no-sync ruff format --check .

  typecheck:
    name: typecheck (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {enable-cache: true}
      - run: uv sync --frozen --extra train --extra serve --extra dev
      - run: uv run mypy

  unit:
    name: unit tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {enable-cache: true, python-version: "${{ matrix.python }}"}
      - run: uv sync --frozen --extra train --extra serve --extra dev
      - name: pytest (unit, no slow)
        run: uv run pytest tests/unit -m "not slow" --cov=xrayml --cov-report=term-missing --cov-report=xml -q
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with: {name: coverage-xml, path: coverage.xml, retention-days: 7}

  no-patient-data:
    name: guard (no medical images in git)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: refuse DICOM / NIfTI / large images
        run: |
          bad=$(git ls-files | grep -Ei '\.(dcm|dicom|nii|nii\.gz)$' || true)
          big=$(git ls-files -z | xargs -0 du -k 2>/dev/null | awk '$1 > 1024 && $2 != "uv.lock" {print $2}')
          if [ -n "$bad$big" ]; then echo "::error::move these to DVC storage: $bad $big"; exit 1; fi
