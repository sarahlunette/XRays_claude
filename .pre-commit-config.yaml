# Same checks locally (pre-commit) and in CI (ci.yml): no "works on my machine".
# Install once: `uv run pre-commit install`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files   # weights / images belong in DVC, not git
        args: [--maxkb=1024]
      - id: detect-private-key
  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout   # notebook outputs may contain patient images
  # ruff and mypy run from uv.lock, so local hooks and CI use the exact same versions.
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run --no-sync ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run --no-sync ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run --no-sync mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: no-dicom-in-git
        name: refuse DICOM / images in git
        entry: "DICOM, PNG and JPEG images go to DVC remote storage"
        language: fail
        files: '\.(dcm|dicom|nii|nii\.gz)$'
