[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "xrayml"
version = "0.1.0"
description = "Fracture detection on musculoskeletal X-rays: an end-to-end ML engineering reference (data -> training -> operating points -> export -> serving -> monitoring)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sarah Le Net" }]
# Base dependencies are what the *serving* container needs. No torch here on purpose:
# the inference image runs ONNX Runtime only (smaller attack surface, smaller SOUP list).
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "pydicom>=3.0",
  "opencv-python-headless>=4.9",
]

[project.optional-dependencies]
train = [
  "torch>=2.3",
  "torchvision>=0.18",
  "timm>=1.0",
  "albumentations>=2.0",
  "pandas>=2.1",
  "pyarrow>=15",
  "scikit-learn>=1.4",
  "scikit-image>=0.22",
  "imagehash>=4.3",
  "pillow>=10",
  "onnx>=1.16",
  "onnxscript>=0.1",
  "onnxruntime>=1.18",
]
serve = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "onnxruntime>=1.18",
]
mlops = [
  "mlflow>=2.12",
  "dvc[s3]>=3.50",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "types-PyYAML",
]

[project.scripts]
xrayml = "xrayml.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/xrayml"]

# CPU wheels for torch in CI and on laptops; GPU machines override with their own index.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

# ---------------------------------------------------------------- tooling
[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "PT", "RUF"]
ignore = [
  "E501",    # formatter owns line length
  "RUF001",  # unicode in strings (×, →) is intentional in reports
  "RUF002",
  "RUF003",
  "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B018", "PT018", "NPY002"]
# Seeding/saving the *global* numpy RNG is the point here: third-party code (albumentations,
# timm, user transforms) draws from it.
"src/xrayml/engine/{seed,checkpoint}.py" = ["NPY002"]
"src/xrayml/data/datasets.py" = ["NPY002"]
"pipelines/**" = ["E402"]

[tool.mypy]
plugins = ["pydantic.mypy"]
# numpy 2.x stubs reject `arr.min()` without an axis ("all overload variants require an argument").
disable_error_code = ["call-overload"]
python_version = "3.11"
packages = ["xrayml"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "integration: end-to-end tests (synthetic data -> train -> evaluate -> export -> serve); slower",
  "slow: tests taking more than ~10 s on CPU",
  "gpu: needs CUDA",
  "data: needs the real FracAtlas download",
]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning",
]

[tool.coverage.run]
source = ["xrayml"]
omit = ["src/xrayml/serving/__main__.py"]
